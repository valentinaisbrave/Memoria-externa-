const db=(configured&&window.supabase)?window.supabase.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true}}):null;

const demo=[
{id:'demo-1',file_name:'un_domingo_de_abril.jpg',file_type:'image',position_x:150,position_y:150,description:'La luz de una tarde que recuerdo.',created_at:'2026-04-12T12:00:00Z',username:'ana',demo_picture:'flowers'},

function loadDemo(){try{const d=JSON.parse(localStorage.getItem(key));return Array.isArray(d)?d:demo}catch{return demo}};
function saveDemo(){try{localStorage.setItem(key,JSON.stringify(memories))}catch{toast('Almacenamiento local lleno: usa imágenes más pequeñas.')}};
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};
function fileIcon(t){if(t==='folder')return `<svg viewBox="0 0 80 65"><path d="M5 14V8h28l8 8h34v43H5z" fill="#d6ab36" stroke="#957b35" stroke-width="1.4"/><path d="M5 20h70v39H5z" fill="#edcd68" stroke="#a78a43" stroke-width="1.2"/></svg>`;if(t==='image')return `<svg viewBox="0 0 75 70"><rect x="9" y="5" width="55" height="57" fill="#fff" stroke="#aaa"/><rect x="15" y="13" width="43" height="37" fill="#d9e4e2"/><circle cx="46" cy="25" r="6" fill="#d9bb7d"/><path d="M16 50 31 31 41 42 48 35 58 50" fill="#8fa79b"/><path d="M20 57h37" stroke="#bbb"/></svg>`;return `<svg viewBox="0 0 75 70"><path d="M15 4h33l12 12v47H15z" fill="#fff" stroke="#92928a"/><path d="M48 4v12h12" fill="#e8e8e2" stroke="#92928a"/><path d="M23 27h28M23 34h28M23 41h21M23 48h25" stroke="#b5b5ad" stroke-width="2"/>${t==='pdf'?'<rect x="20" y="50" width="30" height="9" fill="#c66d5b"/><text x="22" y="57" font-size="7" fill="white">PDF</text>':''}</svg>`}
function fileSrc(m){if(m.demo_picture==='flowers')return 'https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=450&q=75';if(m.demo_picture==='sky')return 'https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=450&q=75';if(m.demo_data)return m.demo_data;return m.storage_path&&db?db.storage.from('memorias').getPublicUrl(m.storage_path).data.publicUrl:null}
function kind(m){return ['pdf','docx','txt'].includes(m.file_type)?'document':m.file_type}
function filtered(){let out=memories.filter(m=>(filter==='all'||(filter==='recent'?new Date(m.created_at)>new Date(Date.now()-30*86400000):filter==='text'?['text','txt'].includes(m.file_type):filter==='document'?['pdf','docx'].includes(m.file_type):m.file_type===filter)));if(query){let q=query.toLowerCase();out=out.filter(m=>[m.file_name,m.username,m.text_content,m.description].some(v=>(v||'').toLowerCase().includes(q)))}return filter==='recent'?out.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)):out}
function render(){const list=filtered();$('#files').innerHTML=list.map(m=>{const src=m.file_type==='image'?fileSrc(m):null;return `<div class="file ${selected===m.id?'selected':''}" data-id="${escapeHtml(m.id)}" style="left:${Number(m.position_x)||0}px;top:${Number(m.position_y)||0}px"><div class="graphic">${src?`<img src="${escapeHtml(src)}" draggable="false" onerror="this.outerHTML='${''}'"/>`:fileIcon(m.file_type)}</div><div class="filename">${escapeHtml(m.file_name)}</div><div class="owner">${escapeHtml(m.username||'anónimo')}</div></div>`}).join('');$('#count').textContent=memories.length;$$('.file').forEach(el=>attachFile(el));}
function attachFile(el){let sx,sy,ox,oy,moved=false;el.addEventListener('pointerdown',e=>{if(e.button!==0)return;const m=memories.find(x=>x.id===el.dataset.id);if(!m)return;selected=m.id;sx=e.clientX;sy=e.clientY;ox=m.position_x;oy=m.position_y;moved=false;el.setPointerCapture(e.pointerId);el.classList.add('selected')});el.addEventListener('pointermove',e=>{if(sx==null)return;const dx=(e.clientX-sx)/scale,dy=(e.clientY-sy)/scale;if(Math.abs(dx)+Math.abs(dy)>7){moved=true;const m=memories.find(x=>x.id===el.dataset.id);if(!m)return;if(db&&(!me||m.user_id!==me.id))return;el.style.left=Math.max(0,Math.round(ox+dx))+'px';el.style.top=Math.max(0,Math.round(oy+dy))+'px'}});el.addEventListener('pointerup',async e=>{if(sx==null)return;const m=memories.find(x=>x.id===el.dataset.id);sx=null;if(!m)return;if(moved){if(db&&(!me||m.user_id!==me.id)){toast('Solo puedes mover tus propias memorias');render();return}const x=parseInt(el.style.left),y=parseInt(el.style.top);m.position_x=x;m.position_y=y;if(db){const {error}=await db.from('memories').update({position_x:x,position_y:y}).eq('id',m.id).eq('user_id',me.id);if(error){toast(error.message);await load()}}else saveDemo();render()}else{render();openMemory(m)}})}
function toast(s){$('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=s;$('.shell').append(e);setTimeout(()=>e.remove(),3400)}
function newWindow(title,content,bottom='',w=625){const box=document.createElement('section');box.className='window';box.style.width=`min(${w}px,90vw)`;box.style.zIndex=++z;box.innerHTML=`<div class="winbar active"><span>▣ ${escapeHtml(title)}</span><div class="wincontrols"><button class="minimize" title="Minimizar">−</button><button class="close" title="Cerrar">×</button></div></div><div class="winbody">${content}</div><div class="winbottom">${bottom}</div>`;$('#windows').append(box);box.querySelector('.close').onclick=()=>box.remove();box.querySelector('.minimize').onclick=()=>{box.querySelector('.winbody').hidden=!box.querySelector('.winbody').hidden};box.addEventListener('pointerdown',()=>box.style.zIndex=++z);makeDraggable(box);return box}
function makeDraggable(box){const bar=box.querySelector('.winbar');let sx=null,sy,left,top;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=box.getBoundingClientRect(),p=$('#viewport').getBoundingClientRect();box.style.left=(r.left-p.left)+'px';box.style.top=(r.top-p.top)+'px';box.style.transform='none';left=parseFloat(box.style.left);top=parseFloat(box.style.top);sx=e.clientX;sy=e.clientY;bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(sx===null)return;box.style.left=Math.max(0,left+e.clientX-sx)+'px';box.style.top=Math.max(0,top+e.clientY-sy)+'px'});bar.addEventListener('pointerup',()=>sx=null)}
function openMemory(m){const src=fileSrc(m),date=new Date(m.created_at).toLocaleDateString('es-ES');let body=`<p class="meta">ARCHIVO: ${escapeHtml(m.file_name)}<br/>DEPOSITADO POR: ${escapeHtml(m.username||'anónimo')} &nbsp;·&nbsp; ${date}${m.description?'<br/>DESCRIPCIÓN: '+escapeHtml(m.description):''}</p>`;
if(m.file_type==='image')body+=src?`<img class="viewer-img" src="${escapeHtml(src)}"/>`:'Imagen no disponible';else if(m.file_type==='pdf')body+=src?`<iframe class="viewer-pdf" src="${escapeHtml(src)}" title="PDF"></iframe>`:'PDF no disponible';else if(m.file_type==='docx')body+=`<p>Este documento puede descargarse para abrirse en un procesador de textos.</p>`;else if(m.file_type==='folder')body+=`<div class="viewer-text">Una carpeta del archivo colectivo.<br/><br/>Los recuerdos permanecen libres sobre el escritorio.</div>`;else body+=`<div class="viewer-text">${escapeHtml(m.text_content||'')}</div>`;

let box=newWindow(m.file_name,body,footer);const del=box.querySelector('.delete');if(del)del.onclick=()=>{if(confirm('¿Eliminar esta memoria del archivo?'))removeMemory(m,box)}}
async function removeMemory(m,box){try{if(db){const {error}=await db.from('memories').delete().eq('id',m.id).eq('user_id',me.id);if(error)throw error;if(m.storage_path)await db.storage.from('memorias').remove([m.storage_path])}else{memories=memories.filter(x=>x.id!==m.id);saveDemo()}box.remove();await load();toast('Memoria eliminada')}catch(e){toast('No se pudo eliminar: '+e.message)}}
function showModal(title,body,onSubmit,action='Guardar'){const shade=document.createElement('div');shade.className='shade';shade.innerHTML=`<div class="modal"><div class="winbar"><span>▣ ${escapeHtml(title)}</span><div class="wincontrols"><button class="close">×</button></div></div><form><div class="winbody">${body}</div><div class="modalfoot"><button type="button" class="btn cancel">Cancelar</button><button type="submit" class="btn primary submit">${escapeHtml(action)}</button></div></form></div>`;$('#overlay').append(shade);const close=()=>shade.remove();shade.querySelector('.close').onclick=close;shade.querySelector('.cancel').onclick=close;shade.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=shade.querySelector('.submit');let warning=shade.querySelector('.save-error');if(!warning){warning=document.createElement('p');warning.className='save-error';warning.setAttribute('role','alert');warning.style.cssText='margin:12px 24px;color:#a32727;white-space:pre-wrap;font:12px/1.5 monospace;overflow-wrap:anywhere';shade.querySelector('.modalfoot').before(warning)}warning.textContent='';const formData=new FormData(e.currentTarget);b.disabled=true;b.textContent='Guardando...';try{await Promise.race([onSubmit(formData,shade),new Promise((_,reject)=>setTimeout(()=>reject(Error('La solicitud tardó más de 25 segundos. Revisa tu conexión y comprueba en Supabase si la memoria se guardó antes de intentarlo de nuevo.')),25000))]);close()}catch(err){const message=err?.message||String(err);warning.textContent='No se pudo guardar: '+message;toast('No se pudo guardar la memoria')}finally{b.disabled=false;b.textContent=action}};return shade}
function choosePosition(){let maxX=Math.max(650,...memories.map(x=>Number(x.position_x)||0)),maxY=Math.max(450,...memories.map(x=>Number(x.position_y)||0));for(let i=0;i<150;i++){let x=120+Math.floor(Math.random()*(Math.min(maxX+550,2600))),y=110+Math.floor(Math.random()*(Math.min(maxY+350,1800)));if(memories.every(m=>Math.abs(x-m.position_x)>145||Math.abs(y-m.position_y)>135))return{x,y}}return{x:maxX+180,y:180+Math.random()*500|0}}
function addMemory(){if(db&&!me){toast('Inicia sesión para depositar una memoria');authModal();return}let modal=showModal('Agregar memoria al archivo',`<label class="field">NOMBRE DEL ARCHIVO<input required maxlength="150" name="name" placeholder="un_recuerdo_que_guardo.txt"/></label><label class="field">TIPO DE MEMORIA<select name="type" id="typeChoice"><option value="text">Texto o recuerdo</option><option value="poem">Poema</option><option value="image">Fotografía o imagen</option><option value="pdf">Documento PDF</option><option value="txt">Archivo TXT</option><option value="docx">Documento DOCX</option><option value="folder">Carpeta</option></select></label><label class="field" id="textField">CONTENIDO<textarea name="content" placeholder="Escribe aquí el fragmento de memoria..."></textarea></label><label class="field" id="uploadField" style="display:none">SELECCIONAR ARCHIVO<input type="file" name="file"/></label><label class="field">DESCRIPCIÓN (OPCIONAL)<input name="description" maxlength="500" placeholder="Algo que quieras conservar sobre este recuerdo"/></label><p class="hint">Tu memoria aparecerá en el mismo escritorio que exploran las demás personas.${!db?' En demostración los cambios se guardan únicamente en este navegador.':''}</p>`,async(fd)=>{
const name=String(fd.get('name')||'').trim(),type=String(fd.get('type')),content=String(fd.get('content')||''),description=String(fd.get('description')||'');const file=fd.get('file');if(!name)throw Error('Escribe un nombre de archivo.');if(['text','poem'].includes(type)&&!content.trim())throw Error('Escribe el contenido de tu memoria.');if(['image','pdf','txt','docx'].includes(type)&&(!file||!file.size))throw Error('Selecciona un archivo.');if(file?.size>10*1024*1024)throw Error('El máximo son 10 MB.');const allowed={image:['image/jpeg','image/png','image/webp'],pdf:['application/pdf'],txt:['text/plain'],docx:['application/vnd.openxmlformats-officedocument.wordprocessingml.document']};if(allowed[type]&& !allowed[type].includes(file.type)&&!(['txt','docx'].includes(type)&&file.name.toLowerCase().endsWith('.'+type)))throw Error('Formato de archivo no admitido.');
const pos=choosePosition();let storage_path=null,demo_data=null;if(db&&file?.size){storage_path=`${me.id}/${crypto.randomUUID()}.${file.name.split('.').pop().toLowerCase()}`;const {error}=await db.storage.from('memorias').upload(storage_path,file,{contentType:file.type,upsert:false});if(error)throw error}else if(file?.size&&type==='image'){demo_data=await new Promise((resolve,reject)=>{const reader=new FileReader;reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
const item={user_id:me?.id,file_name:name,file_type:type,text_content:['text','poem'].includes(type)?content:null,description,storage_path,position_x:pos.x,position_y:pos.y};if(db){const {error}=await db.from('memories').insert(item);if(error){if(storage_path)await db.storage.from('memorias').remove([storage_path]);throw error}}else{memories.push({...item,id:crypto.randomUUID(),created_at:new Date().toISOString(),username:'visitante',demo_data});saveDemo()}await load();toast('Memoria incorporada al archivo')},'Agregar al escritorio');
const select=modal.querySelector('#typeChoice'),tf=modal.querySelector('#textField'),uf=modal.querySelector('#uploadField');select.onchange=()=>{const t=select.value;tf.style.display=['text','poem'].includes(t)?'':'none';uf.style.display=['image','pdf','txt','docx'].includes(t)?'':'none';modal.querySelector('input[type=file]').accept={image:'.jpg,.jpeg,.png,.webp',pdf:'.pdf',txt:'.txt',docx:'.docx'}[t]||''};}
function authModal(){if(!db){toast('Modo demostración. Configura Supabase para activar cuentas compartidas.');return}if(me){showModal('Tu cuenta',`<p class="mono">CONECTADO COMO<br/><br/><strong>${escapeHtml(me.email)}</strong></p><p class="hint">Las aportaciones permanecen vinculadas a tu cuenta.</p>`,async()=>{await db.auth.signOut();me=null;profile=null;await load();setAccount();toast('Sesión cerrada')},'Cerrar sesión');return}
const shade=showModal('Acceder al archivo',`<div class="notice">Para agregar tus recuerdos al escritorio colectivo, crea una cuenta o inicia sesión.</div><label class="field">CORREO ELECTRÓNICO<input name="email" type="email" required autocomplete="email"/></label><label class="field">CONTRASEÑA<input name="password" type="password" minlength="6" required autocomplete="current-password"/></label><div style="display:flex;justify-content:space-between;align-items:center"><label class="field" style="margin:0">OPERACIÓN<select name="op"><option value="login">Iniciar sesión</option><option value="signup">Crear cuenta</option><option value="reset">Recuperar contraseña</option></select></label></div>`,async(fd)=>{const email=String(fd.get('email')),password=String(fd.get('password')),op=fd.get('op');let result;if(op==='login')result=await db.auth.signInWithPassword({email,password});else if(op==='signup')result=await db.auth.signUp({email,password});else result=await db.auth.resetPasswordForEmail(email);if(result.error)throw result.error;if(op==='signup'&&!result.data.session)toast('Revisa tu correo y confirma el registro');else if(op==='reset')toast('Revisa tu correo para recuperar la contraseña');else toast('Sesión iniciada');await refreshAccount()},'Continuar');}
async function refreshAccount(){if(!db)return;const {data}=await db.auth.getUser();me=data?.user||null;setAccount();await load()}
function setAccount(){$('#account').textContent=me?'◉ '+(me.email?.split('@')[0]||'Mi cuenta'):'◯ Iniciar sesión'}
async function load(){if(!db){memories=loadDemo();$('#conn').textContent='ARCHIVO LOCAL';$('#mode').textContent='DEMOSTRACIÓN';render();return}try{const [{data,error},{data:profiles}]=await Promise.all([db.from('memories').select('*').order('created_at',{ascending:true}).limit(1500),db.from('profiles').select('id,username')]);if(error)throw error;const names=Object.fromEntries((profiles||[]).map(p=>[p.id,p.username]));memories=(data||[]).map(m=>({...m,username:names[m.user_id]||'anónimo'}));$('#conn').textContent='ARCHIVO SINCRONIZADO';$('#mode').textContent='SUPABASE / EN LÍNEA';render()}catch(e){$('#conn').textContent='ERROR DE CONEXIÓN';toast(e.message)}}
function realtime(){if(!db)return;if(subscription)db.removeChannel(subscription);subscription=db.channel('archivo-colectivo').on('postgres_changes',{event:'*',schema:'public',table:'memories'},()=>load()).subscribe();}
$('#add').onclick=addMemory;$('#account').onclick=authModal;$('#search').oninput=e=>{query=e.target.value;render()};$$('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});function setZoom(n){scale=Math.min(1.6,Math.max(.55,n));$('#desktop').style.transform=`scale(${scale})`;$('#viewport').querySelector('#desktop').style.marginRight=`${(scale-1)*3000}px`;$('#zoom').textContent=Math.round(scale*100)+'%'}$('#zoomin').onclick=()=>setZoom(scale+.15);$('#zoomout').onclick=()=>setZoom(scale-.15);
async function init(){if(db){const {data}=await db.auth.getSession();me=data.session?.user||null;setAccount();await load();realtime();db.auth.onAuthStateChange((event,session)=>{me=session?.user||null;setAccount();if(event==='SIGNED_IN'||event==='SIGNED_OUT')setTimeout(load,0)});setInterval(load,30000)}else{setAccount();await load();}$('#viewport').scrollLeft=0;$('#viewport').scrollTop=0}init();
</script></body></html>
